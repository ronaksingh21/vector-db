[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "vector-db"
version = "0.1.0"
description = "HNSW vector search, benchmarked and verified for edge/constrained-hardware deployment (Raspberry Pi 5)"
requires-python = ">=3.9"

[tool.scikit-build]
wheel.packages = ["python/vector_db"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
